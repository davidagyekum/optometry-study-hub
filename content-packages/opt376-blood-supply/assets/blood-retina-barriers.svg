<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Blood-retina barrier interfaces</title>
  <desc id="desc">A three-part schematic comparing a continuous retinal capillary, a sealed pigment epithelial layer and a fenestrated choroidal capillary, marked A through C.</desc>
  <rect width="1200" height="675" rx="32" fill="#f7fbfd"/>
  <rect x="85" y="170" width="290" height="320" rx="42" fill="#e7f4fa" stroke="#256f9a" stroke-width="7"/>
  <ellipse cx="230" cy="330" rx="104" ry="72" fill="#f9d6d0" stroke="#c94a4a" stroke-width="16"/>
  <path d="M135 330h190" stroke="#fff" stroke-width="32" stroke-linecap="round"/>
  <g stroke="#11385c" stroke-width="7"><path d="M198 274v112"/><path d="M262 274v112"/></g>
  <rect x="455" y="180" width="290" height="300" rx="28" fill="#f6e9d4" stroke="#a97843" stroke-width="7"/>
  <g fill="#d8a66c" stroke="#80582f" stroke-width="5">
    <rect x="485" y="230" width="74" height="190" rx="20"/><rect x="563" y="230" width="74" height="190" rx="20"/><rect x="641" y="230" width="74" height="190" rx="20"/>
  </g>
  <g fill="#11385c"><circle cx="561" cy="325" r="8"/><circle cx="639" cy="325" r="8"/></g>
  <rect x="825" y="170" width="290" height="320" rx="42" fill="#fbe7e3" stroke="#bb5147" stroke-width="7"/>
  <ellipse cx="970" cy="330" rx="108" ry="76" fill="#f9d6d0" stroke="#c94a4a" stroke-width="16"/>
  <g fill="#fff" stroke="#9e3f3f" stroke-width="4"><circle cx="918" cy="276" r="12"/><circle cx="970" cy="260" r="12"/><circle cx="1022" cy="276" r="12"/><circle cx="918" cy="384" r="12"/><circle cx="970" cy="400" r="12"/><circle cx="1022" cy="384" r="12"/></g>
  <g fill="#11385c" font-family="Arial, sans-serif" font-weight="700" font-size="34" text-anchor="middle">
    <circle cx="200" cy="330" r="29" fill="#fff" stroke="#11385c" stroke-width="5"/><text x="200" y="342">A</text>
    <circle cx="600" cy="216" r="29" fill="#fff" stroke="#11385c" stroke-width="5"/><text x="600" y="228">B</text>
    <circle cx="970" cy="330" r="29" fill="#fff" stroke="#11385c" stroke-width="5"/><text x="970" y="342">C</text>
  </g>
  <text x="600" y="610" fill="#476277" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">Compare the sealed retinal, epithelial and fenestrated choroidal interfaces.</text>
</svg>
