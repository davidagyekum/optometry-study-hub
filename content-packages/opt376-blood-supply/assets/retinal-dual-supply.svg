<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dual retinal vascular supply</title>
  <desc id="desc">A layered retinal schematic showing an inner vascular plexus, an outer choroidal bed and a central vessel-free depression marked A through D.</desc>
  <rect width="1200" height="675" rx="32" fill="#f7fbfd"/>
  <path d="M80 170Q600 92 1120 170V335Q600 268 80 335Z" fill="#e7f4fa" stroke="#256f9a" stroke-width="6"/>
  <path d="M80 335Q600 268 1120 335V455Q600 405 80 455Z" fill="#f6e9d4" stroke="#a97843" stroke-width="6"/>
  <path d="M80 455Q600 405 1120 455V548Q600 512 80 548Z" fill="#f6c6bd" stroke="#bb5147" stroke-width="6"/>
  <path d="M130 247c130-75 220 78 350 0s220 75 350 0 195 58 260 5" fill="none" stroke="#d55757" stroke-width="18" stroke-linecap="round"/>
  <g stroke="#d55757" stroke-width="9" fill="none"><path d="M220 235v70"/><path d="M420 220v72"/><path d="M820 220v72"/><path d="M1010 235v70"/></g>
  <path d="M125 492c95-52 150 48 245 0s150 48 245 0 150 48 245 0 145 35 215 5" fill="none" stroke="#c94a4a" stroke-width="18" stroke-linecap="round"/>
  <path d="M765 150q15 100 55 0" fill="#fff" stroke="#167581" stroke-width="7"/>
  <g fill="#11385c" font-family="Arial, sans-serif" font-weight="700" font-size="34" text-anchor="middle">
    <circle cx="180" cy="330" r="29" fill="#fff" stroke="#11385c" stroke-width="5"/><text x="180" y="342">A</text>
    <circle cx="468" cy="223" r="29" fill="#fff" stroke="#11385c" stroke-width="5"/><text x="468" y="235">B</text>
    <circle cx="780" cy="223" r="29" fill="#fff" stroke="#11385c" stroke-width="5"/><text x="780" y="235">C</text>
    <circle cx="1035" cy="495" r="29" fill="#fff" stroke="#11385c" stroke-width="5"/><text x="1035" y="507">D</text>
  </g>
  <text x="600" y="625" fill="#476277" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">Relate inner retinal vessels, outer choroidal support and the vessel-free centre.</text>
</svg>
