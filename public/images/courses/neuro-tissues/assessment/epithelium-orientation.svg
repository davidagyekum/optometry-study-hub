<rect x="100" y="160" width="130" height="250"/><rect x="230" y="160" width="130" height="250"/><rect x="360" y="160" width="130" height="250"/><rect x="490" y="160" width="130" height="250"/><rect x="620" y="160" width="130" height="250"/><rect x="750" y="160" width="150" height="250"/>
</g>
<g fill="#d0d0d0"><ellipse cx="165" cy="285" rx="30" ry="45"/><ellipse cx="295" cy="285" rx="30" ry="45"/><ellipse cx="425" cy="285" rx="30" ry="45"/><ellipse cx="555" cy="285" rx="30" ry="45"/><ellipse cx="685" cy="285" rx="30" ry="45"/><ellipse cx="825" cy="285" rx="30" ry="45"/></g>
