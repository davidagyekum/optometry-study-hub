<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Original layered neural circuit schematic</title>
  <desc id="desc">A vertical layered circuit with four neutral targets, side connections, and opposing light and signal arrows.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#17375e"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#f8fbfc"/>
  <g stroke="#17375e" stroke-width="8" fill="none">
    <rect x="90" y="105" width="1020" height="105" rx="28" fill="#d9b46f"/>
    <path d="M390 300 L390 620" marker-end="url(#arrow)"/>
    <path d="M620 300 L620 620" marker-end="url(#arrow)"/>
    <path d="M850 300 L850 620" marker-end="url(#arrow)"/>
    <path d="M390 350 C500 300 540 300 620 350" stroke="#237f86"/>
    <path d="M620 535 C720 485 770 485 850 535" stroke="#a24c5c"/>
    <path d="M230 735 L230 255" marker-end="url(#arrow)" stroke-dasharray="22 18"/>
    <path d="M1020 260 L1020 735" marker-end="url(#arrow)"/>
  </g>
  <g fill="#e8f3f6" stroke="#17375e" stroke-width="7">
    <ellipse cx="390" cy="300" rx="42" ry="80"/>
    <ellipse cx="620" cy="300" rx="42" ry="80"/>
    <ellipse cx="850" cy="300" rx="42" ry="80"/>
    <ellipse cx="390" cy="515" rx="45" ry="65"/>
    <ellipse cx="620" cy="515" rx="45" ry="65"/>
    <ellipse cx="850" cy="515" rx="45" ry="65"/>
    <circle cx="390" cy="700" r="55"/>
    <circle cx="620" cy="700" r="55"/>
    <circle cx="850" cy="700" r="55"/>
  </g>
  <g id="neutral-targets" fill="#fff" stroke="#e06b55" stroke-width="10">
    <circle cx="180" cy="162" r="34"/><circle cx="384" cy="270" r="34"/>
    <circle cx="624" cy="468" r="34"/><circle cx="864" cy="675" r="34"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="28" fill="#17375e">
    <text x="170" y="800">Light</text><text x="955" y="800">Signal</text>
  </g>
</svg>
