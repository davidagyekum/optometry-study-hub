<text x="54" y="72" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Stereopsis test taxonomy</text><rect x="85" y="135" width="280" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="125" y="178" font-family="Arial" font-size="25" font-weight="700" fill="#1e3a8a">Near tests</text><text x="125" y="215" font-family="Arial" font-size="18" fill="#1e3a8a">Randot • Stereofly • PASS</text><rect x="435" y="135" width="280" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="475" y="178" font-family="Arial" font-size="25" font-weight="700" fill="#14532d">Distance tests</text><text x="475" y="215" font-family="Arial" font-size="18" fill="#14532d">Howard-Dolman • projector</text><text x="150" y="315" font-family="Arial" font-size="19" fill="#334155">Most clinical stereotests are near because stereopsis is most useful within arm’s length.</text></svg>