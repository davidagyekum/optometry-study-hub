<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Three aqueous-dynamic IOP sites</title>
  <desc id="desc">Simplified anterior eye showing three neutral targets connected by an aqueous flow path.</desc>
  <rect width="1200" height="675" rx="36" fill="#f8fbfd"/>
  <path d="M170 90 Q55 338 170 585 Q265 520 300 338 Q265 155 170 90Z" fill="#dff5f4" stroke="#0e7490" stroke-width="10"/>
  <path d="M560 150 Q710 338 560 525 Q495 470 475 338 Q495 205 560 150Z" fill="#e8eef9" stroke="#18345d" stroke-width="10"/>
  <path d="M445 180 Q370 250 385 338 Q370 425 445 500" fill="none" stroke="#ef6f61" stroke-width="22" stroke-linecap="round"/>
  <path d="M720 445 q75-90 165 0 l-18 70 q-70 45-130 0Z" fill="#f4c97a" stroke="#a45a18" stroke-width="9"/>
  <path d="M815 420 C680 350 560 270 455 305 C350 338 300 380 250 435 C205 480 150 430 110 350" fill="none" stroke="#14b8a6" stroke-width="13" stroke-linecap="round" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#14b8a6"/></marker></defs>
  <path d="M250 435 l45 25 l-25 50 l-55-28Z" fill="#8ba3c7" stroke="#18345d" stroke-width="7"/>
  <ellipse cx="120" cy="325" rx="55" ry="28" fill="#fff" stroke="#0e7490" stroke-width="8"/>
  <g font-family="Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle">
    <circle cx="840" cy="418" r="38" fill="#fff" stroke="#18345d" stroke-width="7"/><text x="840" y="431" fill="#18345d">A</text>
    <circle cx="324" cy="378" r="38" fill="#fff" stroke="#18345d" stroke-width="7"/><text x="324" y="391" fill="#18345d">B</text>
    <circle cx="132" cy="263" r="38" fill="#fff" stroke="#18345d" stroke-width="7"/><text x="132" y="276" fill="#18345d">C</text>
  </g>
  <g fill="#314867" font-family="Arial, sans-serif" font-size="25"><text x="650" y="105">Follow the continuous fluid path</text><text x="650" y="570">Targets identify three distinct control sites</text></g>
</svg>