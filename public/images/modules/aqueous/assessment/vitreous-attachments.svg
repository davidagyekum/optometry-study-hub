  <path d="M455 225 Q520 338 455 450" fill="none" stroke="#14b8a6" stroke-width="10" stroke-dasharray="18 14"/>
  <path d="M475 180 Q515 210 535 245" fill="none" stroke="#ef6f61" stroke-width="18" stroke-linecap="round"/>
  <path d="M1000 310 q50 28 0 56 q-45-28 0-56Z" fill="#ef6f61" stroke="#9f2d2a" stroke-width="7"/>
